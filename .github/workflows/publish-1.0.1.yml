name: Publish 1.0.1 release

on:
  push:
    paths:
      - '.github/workflows/publish-1.0.1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/autowatchowntopics
          rsync -a ./ build/autowatchowntopics/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'downloads/' \
            --exclude 'build/'
          cd build
          zip -qr ../bennybernaer_autowatchowntopics_1.0.1.zip autowatchowntopics
          cd ..

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create 1.0.1 \
            bennybernaer_autowatchowntopics_1.0.1.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Auto-subscribe own topics 1.0.1' \
            --notes 'phpBB 3.3.x build. Fixes stale phpBB notifications remaining after the related post or topic has been deleted. Requires PHP 7.4 or newer.'

      - name: Add release ZIP to downloads and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp bennybernaer_autowatchowntopics_1.0.1.zip downloads/
          rm -f .github/workflows/publish-1.0.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'Add 1.0.1 release ZIP to downloads'
          git push
